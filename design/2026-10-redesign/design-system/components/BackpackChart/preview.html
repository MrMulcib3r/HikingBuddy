<!doctype html>
<html>
<head><meta charset="utf-8"><title>BackpackChart — preview</title>
<style>body{margin:0;background:var(--bg)} .pv{padding:20px;display:flex;flex-wrap:wrap;gap:16px;align-items:center} .pv-col{display:grid;gap:12px} .pv-cap{font:500 12px/16px var(--font-sans);color:var(--ink-muted)}</style>
</head>
<body>
<div class="hb" style="padding:24px;display:grid;gap:20px">
<div class="pv-cap" style="font-size:13px">Drag the base weight to see the pack change tier: Ultralight under 4.5 kg, Lightweight 4.5 to 6.8 kg, Traditional over 6.8 kg.</div>
<label style="display:flex;gap:12px;align-items:center"><span class="hb-label">Base weight</span><input id="bw" type="range" min="2000" max="10000" step="100" value="6270" style="flex:1;accent-color:var(--accent)"><span id="bwv" class="hb-num" style="width:64px;text-align:right"></span></label>
<div id="pack"></div>
<div style="display:grid;grid-template-columns:repeat(3,1fr);gap:16px;border-top:1px solid var(--line);padding-top:16px"><div id="p0"></div><div id="p1"></div><div id="p2"></div></div></div>
<script>var S={"unit": "metric", "worn": 1650, "categories": [{"id": "cat-backpack", "name": "Backpack", "icon": "backpack", "color": "cat-backpack", "grams": 1100}, {"id": "cat-shelter", "name": "Shelter System", "icon": "tent", "color": "cat-shelter", "grams": 1250}, {"id": "cat-sleep", "name": "Sleep System", "icon": "bed-double", "color": "cat-sleep", "grams": 1450}, {"id": "cat-clothing", "name": "Clothing", "icon": "shirt", "color": "cat-clothing", "grams": 900}, {"id": "cat-cooking", "name": "Cooking", "icon": "cooking-pot", "color": "cat-cooking", "grams": 420}, {"id": "cat-water", "name": "Water", "icon": "droplet", "color": "cat-water", "grams": 180}, {"id": "cat-electronics", "name": "Electronics", "icon": "battery-charging", "color": "cat-electronics", "grams": 520}, {"id": "cat-hygiene", "name": "Hygiene", "icon": "bath", "color": "cat-hygiene", "grams": 210}, {"id": "cat-food", "name": "Food", "icon": "apple", "color": "cat-food", "grams": 3200}, {"id": "cat-misc", "name": "Misc", "icon": "package", "color": "cat-misc", "grams": 240}], "shape": "rounded", "base": 6270, "consumable": 3200}; function scaled(base){var k=base/S.base;var c=JSON.parse(JSON.stringify(S));c.categories.forEach(function(x){if(x.color!=="cat-food")x.grams=Math.round(x.grams*k)});c.base=base;return c} var el=document.getElementById("pack"),r=document.getElementById("bw"),v=document.getElementById("bwv"); function draw(){v.textContent=(r.value/1000).toFixed(1)+" kg";HB.backpack(el,scaled(+r.value))} r.addEventListener("input",draw); draw(); [3200,5600,8200].forEach(function(b,i){var e=document.getElementById("p"+i);HB.backpack(e,scaled(b));e.querySelector(".hb-legend").remove();});</script>
</body>
</html>
