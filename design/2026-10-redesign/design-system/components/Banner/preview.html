<!doctype html>
<html>
<head><meta charset="utf-8"><title>Banner — preview</title>
<style>body{margin:0;background:var(--bg)} .pv{padding:20px;display:flex;flex-wrap:wrap;gap:16px;align-items:center} .pv-col{display:grid;gap:12px} .pv-cap{font:500 12px/16px var(--font-sans);color:var(--ink-muted)}</style>
</head>
<body>
<div class="hb pv" style="display:grid">
  <div class="hb-banner hb-banner--success"><i data-lucide="hard-drive"></i><div class="hb-banner-body"><strong>Saving to hikingbuddy-data.json</strong> · last saved 14:32</div></div>
  <div class="hb-banner hb-banner--warning"><i data-lucide="triangle-alert"></i><div class="hb-banner-body"><strong>Not saving to a file.</strong> Your gear lives only in this browser. Connect a data file to keep it safe.</div><div class="hb-banner-actions"><button class="hb-btn hb-btn--secondary hb-btn--sm">Connect data file</button></div></div>
  <div class="hb-banner hb-banner--danger"><i data-lucide="file-x"></i><div class="hb-banner-body"><strong>Can't find your data file.</strong> It may have been moved or renamed.</div><div class="hb-banner-actions"><button class="hb-btn hb-btn--secondary hb-btn--sm">Reconnect</button></div></div>
  <div class="hb-banner"><i data-lucide="map"></i><div class="hb-banner-body">This is your <strong>template</strong>. New gearlists can start from it.</div><button class="hb-icon-btn hb-icon-btn--sm" aria-label="Close" data-tip="Don't show again"><i data-lucide="x"></i></button></div>
</div>
<script>HB.mountIcons();</script>
</body>
</html>
