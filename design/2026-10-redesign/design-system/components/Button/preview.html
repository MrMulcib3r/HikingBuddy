<!doctype html>
<html>
<head><meta charset="utf-8"><title>Button — preview</title>
<style>body{margin:0;background:var(--bg)} .pv{padding:20px;display:flex;flex-wrap:wrap;gap:16px;align-items:center} .pv-col{display:grid;gap:12px} .pv-cap{font:500 12px/16px var(--font-sans);color:var(--ink-muted)}</style>
</head>
<body>
<div class="hb pv">
  <button class="hb-btn hb-btn--primary"><i data-lucide="plus"></i>New gearlist</button>
  <button class="hb-btn hb-btn--secondary"><i data-lucide="hard-drive-download"></i>Export backup</button>
  <button class="hb-btn hb-btn--ghost">Cancel</button>
  <button class="hb-btn hb-btn--danger"><i data-lucide="trash-2"></i>Delete everywhere</button>
  <button class="hb-btn hb-btn--primary hb-btn--sm">Add</button>
  <button class="hb-btn hb-btn--primary" disabled>Share</button>
  <div style="width:100%;max-width:360px"><button class="hb-btn hb-btn--primary hb-btn--block"><i data-lucide="plus"></i>Add gear</button></div>
</div>
<script>HB.mountIcons();</script>
</body>
</html>
