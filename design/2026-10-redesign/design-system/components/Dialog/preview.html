<!doctype html>
<html>
<head><meta charset="utf-8"><title>Dialog — preview</title>
<style>body{margin:0;background:var(--bg)} .pv{padding:20px;display:flex;flex-wrap:wrap;gap:16px;align-items:center} .pv-col{display:grid;gap:12px} .pv-cap{font:500 12px/16px var(--font-sans);color:var(--ink-muted)}</style>
</head>
<body>
<div class="hb" style="position:relative;height:420px"><div class="hb-scrim">
<div class="hb-dialog" role="dialog" aria-labelledby="dlg-t">
  <h2 class="hb-dialog-title" id="dlg-t"><i data-hb-icon="carabiner"></i>This item is used elsewhere</h2>
  <p class="hb-dialog-text">You changed the weight of <strong>Durston X-Mid 1</strong> from 1 020 g to 980 g. It is also used in:</p>
  <ul class="hb-dialog-list"><li><i data-lucide="list"></i>Nordkalottleden 2027</li><li><i data-lucide="list"></i>Weekend Beskydy</li><li><i data-lucide="map"></i>Template</li></ul>
  <div class="hb-dialog-actions"><button class="hb-btn hb-btn--ghost hb-spacer">Cancel</button><button class="hb-btn hb-btn--secondary"><i data-lucide="copy-plus"></i>Create a copy of the item</button><button class="hb-btn hb-btn--primary"><i data-lucide="check"></i>Continue</button></div>
</div></div></div>
<script>HB.mountIcons();</script>
</body>
</html>
