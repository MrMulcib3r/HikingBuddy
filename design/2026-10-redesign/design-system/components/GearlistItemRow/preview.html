<!-- @dsCard group="Gear rows" height=330 -->
<!doctype html>
<html>
<head><meta charset="utf-8"><title>GearlistItemRow — preview</title>
<style>body{margin:0;background:var(--bg)} .pv{padding:20px;display:flex;flex-wrap:wrap;gap:16px;align-items:center} .pv-col{display:grid;gap:12px} .pv-cap{font:500 12px/16px var(--font-sans);color:var(--ink-muted)}</style>
</head>
<body>
<div class="hb" style="padding:20px"><div class="hb-panel">
<div class="hb-list-head" aria-hidden="true"><span></span><span>Item</span><span class="hb-list-head-flags"><span>Worn</span><span>Cons.</span></span><span>Weight</span><span>Qty</span><span>Total</span><span></span></div>
<div class="hb-cat-head"><span class="hb-dot" style="background:var(--cat-shelter)"></span><i data-lucide="tent"></i><span class="hb-cat-name">Mixed sample</span><span class="hb-cat-total hb-num">2.12 kg</span></div>
<div class="hb-row hb-row--list is-hover"><span class="hb-grip"><i data-lucide="grip-vertical"></i></span>
<div class="hb-row-main"><div class="hb-row-name"><span class="hb-inline">Durston X-Mid 1</span></div><div class="hb-row-note"><span class="hb-inline">incl. stakes</span></div></div>
<div class="hb-flags"><button class="hb-flag" aria-pressed="false" aria-label="Worn" data-tip="Worn: carried on your body"><i data-hb-icon="boot"></i></button><button class="hb-flag" aria-pressed="false" aria-label="Consumable" data-tip="Consumable: food, fuel, water"><i data-lucide="utensils"></i></button></div>
<span class="hb-row-w">1 020 g</span><span class="hb-row-qty">× <span class="hb-inline">1</span></span><span class="hb-row-sub">1.02 kg</span>
<span class="hb-row-actions"><button class="hb-icon-btn hb-icon-btn--sm" aria-label="Remove from gearlist" data-tip="Remove from gearlist"><i data-lucide="x"></i></button></span></div><div class="hb-row hb-row--list"><span class="hb-grip"><i data-lucide="grip-vertical"></i></span>
<div class="hb-row-main"><div class="hb-row-name"><span class="hb-inline">Merino T-shirt</span></div><div class="hb-row-note"><span class="hb-inline">Icebreaker 150</span></div></div>
<div class="hb-flags"><button class="hb-flag" aria-pressed="true" aria-label="Worn" data-tip="Worn: carried on your body"><i data-hb-icon="boot"></i></button><button class="hb-flag" aria-pressed="false" aria-label="Consumable" data-tip="Consumable: food, fuel, water"><i data-lucide="utensils"></i></button></div>
<span class="hb-row-w">140 g</span><span class="hb-row-qty">× <span class="hb-inline">1</span></span><span class="hb-row-sub">140 g</span>
<span class="hb-row-actions"><button class="hb-icon-btn hb-icon-btn--sm" aria-label="Remove from gearlist" data-tip="Remove from gearlist"><i data-lucide="x"></i></button></span></div><div class="hb-row hb-row--list"><span class="hb-grip"><i data-lucide="grip-vertical"></i></span>
<div class="hb-row-main"><div class="hb-row-name"><span class="hb-inline">Freeze-dried dinner</span></div><div class="hb-row-note"><span class="hb-inline hb-inline--placeholder">Add a note…</span></div></div>
<div class="hb-flags"><button class="hb-flag" aria-pressed="false" aria-label="Worn" data-tip="Worn: carried on your body"><i data-hb-icon="boot"></i></button><button class="hb-flag" aria-pressed="true" aria-label="Consumable" data-tip="Consumable: food, fuel, water"><i data-lucide="utensils"></i></button></div>
<span class="hb-row-w">160 g</span><span class="hb-row-qty">× <span class="hb-inline">6</span></span><span class="hb-row-sub">960 g</span>
<span class="hb-row-actions"><button class="hb-icon-btn hb-icon-btn--sm" aria-label="Remove from gearlist" data-tip="Remove from gearlist"><i data-lucide="x"></i></button></span></div>
<div class="hb-drop-hint" aria-hidden="true"></div></div></div>
<script>HB.mountIcons();</script>
</body>
</html>
