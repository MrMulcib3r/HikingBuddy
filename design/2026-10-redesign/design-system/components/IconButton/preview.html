<!doctype html>
<html>
<head><meta charset="utf-8"><title>IconButton — preview</title>
<style>body{margin:0;background:var(--bg)} .pv{padding:20px;display:flex;flex-wrap:wrap;gap:16px;align-items:center} .pv-col{display:grid;gap:12px} .pv-cap{font:500 12px/16px var(--font-sans);color:var(--ink-muted)}</style>
</head>
<body>
<div class="hb pv" style="padding-top:56px;padding-left:64px">
  <button class="hb-icon-btn hb-icon-btn--outlined is-tip-open" data-tip="Save snapshot" aria-label="Save snapshot"><i data-lucide="camera"></i></button>
  <button class="hb-icon-btn hb-icon-btn--outlined" data-tip="View snapshot" aria-label="View snapshot"><i data-lucide="images"></i></button>
  <button class="hb-icon-btn hb-icon-btn--outlined" data-tip="Share read-only link" aria-label="Share read-only link"><i data-lucide="signpost"></i></button>
  <button class="hb-icon-btn hb-icon-btn--outlined" data-tip="Update template" aria-label="Update template"><i data-lucide="map"></i></button>
  <button class="hb-icon-btn hb-icon-btn--outlined hb-icon-btn--danger" data-tip="Delete gearlist" aria-label="Delete gearlist"><i data-lucide="trash-2"></i></button>
  <button class="hb-icon-btn hb-icon-btn--outlined" data-tip="New gearlist" aria-label="New gearlist"><i data-lucide="plus"></i></button>
  <span class="pv-cap">Share dialog:</span>
  <button class="hb-icon-btn hb-icon-btn--outlined" data-tip="Copy link" aria-label="Copy link"><i data-lucide="copy"></i></button>
  <button class="hb-icon-btn hb-icon-btn--outlined" data-tip="Open preview" aria-label="Open preview"><i data-lucide="external-link"></i></button>
  <span class="pv-cap">Data file:</span>
  <button class="hb-icon-btn hb-icon-btn--outlined" data-tip="Connect data file" aria-label="Connect data file"><i data-lucide="hard-drive"></i></button>
  <button class="hb-icon-btn hb-icon-btn--outlined" data-tip="Stop saving to this file" aria-label="Disconnect data file"><i data-lucide="unplug"></i></button>
  <span class="pv-cap">Row actions:</span>
  <button class="hb-icon-btn hb-icon-btn--sm" data-tip="Create a copy of the item" aria-label="Create a copy of the item"><i data-lucide="copy-plus"></i></button>
  <button class="hb-icon-btn hb-icon-btn--sm" data-tip="Remove from gearlist" aria-label="Remove from gearlist"><i data-lucide="x"></i></button>
  <button class="hb-icon-btn hb-icon-btn--sm hb-icon-btn--danger" data-tip="Delete from Gear Vault" aria-label="Delete from Gear Vault"><i data-lucide="trash-2"></i></button>
</div>
<script>HB.mountIcons();</script>
</body>
</html>
