<!doctype html>
<html>
<head><meta charset="utf-8"><title>IconButton — preview</title>
<style>body{margin:0;background:var(--bg)} .pv{padding:20px;display:flex;flex-wrap:wrap;gap:16px;align-items:center} .pv-col{display:grid;gap:12px} .pv-cap{font:500 12px/16px var(--font-sans);color:var(--ink-muted)}</style>
</head>
<body>
<div class="hb pv" style="padding-top:56px;padding-left:64px">
  <button class="hb-icon-btn hb-icon-btn--outlined is-tip-open" data-tip="New gearlist" aria-label="New gearlist"><i data-lucide="plus"></i></button>
  <button class="hb-icon-btn hb-icon-btn--outlined hb-icon-btn--danger" data-tip="Delete gearlist" aria-label="Delete gearlist"><i data-lucide="trash-2"></i></button>
  <span class="pv-cap">Row actions:</span>
  <button class="hb-icon-btn hb-icon-btn--sm" data-tip="Remove from gearlist" aria-label="Remove from gearlist"><i data-lucide="x"></i></button>
  <button class="hb-icon-btn hb-icon-btn--sm hb-icon-btn--danger" data-tip="Delete from Gear Vault" aria-label="Delete from Gear Vault"><i data-lucide="trash-2"></i></button>
  <button class="hb-icon-btn hb-icon-btn--sm" data-tip="Copy link" aria-label="Copy link"><i data-lucide="copy"></i></button>
</div>
<script>HB.mountIcons();</script>
</body>
</html>
