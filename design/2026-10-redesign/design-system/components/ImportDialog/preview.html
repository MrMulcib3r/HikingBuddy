<!-- @dsCard group="Account" height=440 subtitle="First sign-in with local data" -->
<!doctype html>
<html>
<head><meta charset="utf-8"><title>ImportDialog — preview</title>
<style>body{margin:0;background:var(--bg)}</style>
</head>
<body>
<div class="hb" style="position:relative;height:440px"><div class="hb-scrim">
<div class="hb-dialog" role="dialog" aria-labelledby="im-t">
  <h2 class="hb-dialog-title" id="im-t"><i data-lucide="hard-drive-upload"></i>Import your local gear?</h2>
  <p class="hb-dialog-text">This browser has HikingBuddy data that is not in your account yet.</p>
  <div class="hb-counts">
    <div class="hb-count"><span class="hb-count-n">48</span><span class="hb-count-l"><i data-lucide="backpack"></i>items in Gear Vault</span></div>
    <div class="hb-count"><span class="hb-count-n">3</span><span class="hb-count-l"><i data-lucide="list"></i>gearlists</span></div>
    <div class="hb-count"><span class="hb-count-n">1</span><span class="hb-count-l"><i data-lucide="map"></i>template</span></div>
  </div>
  <p class="hb-fineprint">Your local data stays in this browser either way.</p>
  <div class="hb-dialog-actions"><button class="hb-btn hb-btn--secondary">Start with an empty account</button><button class="hb-btn hb-btn--primary"><i data-lucide="hard-drive-upload"></i>Import your local data to your account</button></div>
</div></div></div>
<script>HB.mountIcons();</script>
</body>
</html>
