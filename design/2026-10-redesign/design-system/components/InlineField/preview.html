<!doctype html>
<html>
<head><meta charset="utf-8"><title>InlineField — preview</title>
<style>body{margin:0;background:var(--bg)} .pv{padding:20px;display:flex;flex-wrap:wrap;gap:16px;align-items:center} .pv-col{display:grid;gap:12px} .pv-cap{font:500 12px/16px var(--font-sans);color:var(--ink-muted)}</style>
</head>
<body>
<div class="hb pv" style="align-items:flex-start;gap:28px">
  <div class="pv-col"><span class="pv-cap">Rest</span><span class="hb-inline">Durston X-Mid 1</span></div>
  <div class="pv-col"><span class="pv-cap">Hover: click to edit</span><span class="hb-inline is-hover">Durston X-Mid 1</span></div>
  <div class="pv-col"><span class="pv-cap">Editing: Enter / blur saves, Esc cancels</span><input class="hb-inline-input" id="pv-inline" value="Durston X-Mid 1" size="18"></div>
  <div class="pv-col"><span class="pv-cap">Number</span><input class="hb-inline-input hb-num" id="pv-inline-n" value="1250" size="6"></div>
  <div class="pv-col"><span class="pv-cap">Empty note</span><span class="hb-inline hb-inline--placeholder">Add a note…</span></div>
</div>
<script>HB.mountIcons();</script>
</body>
</html>
