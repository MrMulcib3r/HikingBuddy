<!doctype html>
<html>
<head><meta charset="utf-8"><title>TextField — preview</title>
<style>body{margin:0;background:var(--bg)} .pv{padding:20px;display:flex;flex-wrap:wrap;gap:16px;align-items:center} .pv-col{display:grid;gap:12px} .pv-cap{font:500 12px/16px var(--font-sans);color:var(--ink-muted)}</style>
</head>
<body>
<div class="hb pv" style="align-items:flex-start;display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr))">
  <label class="hb-field"><span class="hb-label">Name</span><input class="hb-input" id="pv-name" placeholder="e.g. Snickers"></label>
  <label class="hb-field"><span class="hb-label">Weight (g/unit)</span><input class="hb-input is-error" id="pv-w" value="-5"><span class="hb-field-error">Weight must be 0 or more.</span></label>
  <div class="hb-search"><i data-lucide="search"></i><input class="hb-input" id="pv-search" placeholder="Search gear…"></div>
</div>
<script>HB.mountIcons();</script>
</body>
</html>
