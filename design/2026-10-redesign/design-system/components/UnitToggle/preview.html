<!doctype html>
<html>
<head><meta charset="utf-8"><title>UnitToggle — preview</title>
<style>body{margin:0;background:var(--bg)} .pv{padding:20px;display:flex;flex-wrap:wrap;gap:16px;align-items:center} .pv-col{display:grid;gap:12px} .pv-cap{font:500 12px/16px var(--font-sans);color:var(--ink-muted)}</style>
</head>
<body>
<div class="hb pv"><div class="hb-seg" role="group" aria-label="Units"><button aria-pressed="true">g / kg</button><button aria-pressed="false">oz / lb</button></div></div>
<script>HB.mountIcons(); document.querySelectorAll(".hb-seg button").forEach(function(b,i,all){b.addEventListener("click",function(){all.forEach(function(x){x.setAttribute("aria-pressed",x===b)})})});</script>
</body>
</html>
