<!doctype html>
<html>
<head><meta charset="utf-8"><title>VaultItemRow — preview</title>
<style>body{margin:0;background:var(--bg)} .pv{padding:20px;display:flex;flex-wrap:wrap;gap:16px;align-items:center} .pv-col{display:grid;gap:12px} .pv-cap{font:500 12px/16px var(--font-sans);color:var(--ink-muted)}</style>
</head>
<body>
<div class="hb" style="padding:20px"><div class="hb-panel">
<div class="hb-cat-head"><span class="hb-grip"><i data-lucide="grip-vertical"></i></span><span class="hb-dot" style="background:var(--cat-shelter)"></span><i data-lucide="tent"></i><span class="hb-cat-name"><span class="hb-inline">Shelter System</span></span><span class="hb-cat-total hb-num">1.64 kg</span></div>
<div class="hb-row hb-row--vault is-hover"><span class="hb-grip"><i data-lucide="grip-vertical"></i></span>
<div class="hb-row-main"><div class="hb-row-name"><span class="hb-inline">Durston X-Mid 1</span></div><div class="hb-row-note">incl. stakes and stuff sack</div></div>
<span><span class="hb-badge hb-badge--linked" data-tip="Editing it changes these gearlists too"><i data-hb-icon="carabiner"></i>2 lists</span></span>
<span class="hb-row-w">1 020 g</span><span class="hb-row-qty">×1</span>
<span class="hb-row-actions"><button class="hb-icon-btn hb-icon-btn--sm" aria-label="Create a copy of the item" data-tip="Create a copy of the item"><i data-lucide="copy-plus"></i></button><button class="hb-icon-btn hb-icon-btn--sm hb-icon-btn--danger" aria-label="Delete" data-tip="Delete from Gear Vault"><i data-lucide="trash-2"></i></button></span></div><div class="hb-row hb-row--vault"><span class="hb-grip"><i data-lucide="grip-vertical"></i></span>
<div class="hb-row-main"><div class="hb-row-name"><span class="hb-inline">Tyvek groundsheet</span></div></div>
<span></span>
<span class="hb-row-w">95 g</span><span class="hb-row-qty">×1</span>
<span class="hb-row-actions"><button class="hb-icon-btn hb-icon-btn--sm" aria-label="Create a copy of the item" data-tip="Create a copy of the item"><i data-lucide="copy-plus"></i></button><button class="hb-icon-btn hb-icon-btn--sm hb-icon-btn--danger" aria-label="Delete" data-tip="Delete from Gear Vault"><i data-lucide="trash-2"></i></button></span></div><div class="hb-row hb-row--vault"><span class="hb-grip"><i data-lucide="grip-vertical"></i></span>
<div class="hb-row-main"><div class="hb-row-name"><span class="hb-inline">Trekking poles (as tent poles)</span></div><div class="hb-row-note">Leki Makalu</div></div>
<span><span class="hb-badge hb-badge--linked" data-tip="Editing it changes these gearlists too"><i data-hb-icon="carabiner"></i>2 lists</span></span>
<span class="hb-row-w">520 g</span><span class="hb-row-qty">×1</span>
<span class="hb-row-actions"><button class="hb-icon-btn hb-icon-btn--sm" aria-label="Create a copy of the item" data-tip="Create a copy of the item"><i data-lucide="copy-plus"></i></button><button class="hb-icon-btn hb-icon-btn--sm hb-icon-btn--danger" aria-label="Delete" data-tip="Delete from Gear Vault"><i data-lucide="trash-2"></i></button></span></div>
<button class="hb-add-inline"><i data-lucide="plus"></i>Add item</button></div></div>
<script>HB.mountIcons();</script>
</body>
</html>
